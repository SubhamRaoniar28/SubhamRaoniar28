<style>
@font-face{font-family:"BG";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"JBM";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
.name{font-family:"BG",ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;font-size:74px;letter-spacing:-1.5px;fill:#1F2328}
.mono{font-family:"JBM",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500}
.role{font-size:25px;fill:#087EA4}
.place{font-size:17px;fill:#57606A}
.ln{transform-box:fill-box;transform-origin:left center;animation-duration:8s;animation-timing-function:ease-out;animation-iteration-count:infinite}
.cursor{animation:blink 1s steps(1) infinite}
.tapA{animation:tap .34s ease-in-out infinite alternate}
.tapB{animation:tap .34s ease-in-out .17s infinite alternate}
.head{animation:nod 5s ease-in-out infinite}
.steam{animation:rise 3.2s ease-out infinite}
.steam2{animation-delay:1.6s}
@keyframes ln0{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}10%{transform:scaleX(0)}18%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln1{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}20%{transform:scaleX(0)}28%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln2{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}30%{transform:scaleX(0)}38%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln3{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}40%{transform:scaleX(0)}48%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln4{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}50%{transform:scaleX(0)}58%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln5{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}60%{transform:scaleX(0)}68%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}@keyframes ln6{0%{transform:scaleX(1);opacity:1}6%{transform:scaleX(1);opacity:0}7%{transform:scaleX(0);opacity:1}70%{transform:scaleX(0)}78%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:1}}
.leaf{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}
.leaf2{animation-duration:5s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes tap{to{transform:translateY(-3px)}}
@keyframes nod{50%{transform:translateY(1.5px)}}
@keyframes rise{0%{transform:translateY(6px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ln,.cursor,.tapA,.tapB,.head,.steam,.leaf{animation:none}}
</style>
