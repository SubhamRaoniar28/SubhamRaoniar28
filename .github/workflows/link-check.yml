name: Check README links

on:
  schedule:
    - cron: "30 2 * * 1" # Mondays, 08:00 IST
  workflow_dispatch:
  push:
    branches: [master, "ops/**"]
    paths:
      - "README.md"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links and images
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # linkedin.com, x.com and mysql.com block automated checkers but work in a browser
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept "200..=299,429"
            --exclude "^https?://([a-z0-9-]+\.)?linkedin\.com"
            --exclude "^https?://(www\.)?(x|twitter)\.com"
            --exclude "^https?://([a-z0-9-]+\.)?mysql\.com"
            README.md
          output: lychee/report.md
          fail: false

      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0 && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color d73a4a --description "Reported by the weekly link check" 2>/dev/null || true
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file lychee/report.md
          else
            gh issue create --title "Broken links in profile README" --label broken-links --body-file lychee/report.md
          fi

      - name: Close the issue once everything passes
        if: steps.lychee.outputs.exit_code == 0 && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All README links pass again."
          fi

      - name: Fail the run on preview branches with broken links
        if: steps.lychee.outputs.exit_code != 0 && github.ref != 'refs/heads/master'
        run: |
          cat lychee/report.md
          exit 1
